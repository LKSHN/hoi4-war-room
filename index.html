<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Germany Blitzkrieg Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field-dossier. Command bar + tabs; Game plan is one long phased checklist, Focus/Research sit side by side, Builds is a grid of reference cards */
:root{
  --bg:#e9e7df; --panel:#f5f4ef; --ink:#23261f; --muted:#666a5d; --line:#cfccbf;
  --accent:#94651a; --accent-soft:#f0e2c6; --done:#8d907f;
  --f-display:"Saira Stencil One", "Arial Narrow", Impact, sans-serif;
  --f-body:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1d19; --panel:#24271f; --ink:#e4e1d4; --muted:#9a9c8c; --line:#3a3d33;
  --accent:#d9a548; --accent-soft:#3b3220; --done:#6c6f62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1d19; --panel:#24271f; --ink:#e4e1d4; --muted:#9a9c8c; --line:#3a3d33;
  --accent:#d9a548; --accent-soft:#3b3220; --done:#6c6f62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px}
.sub a,.foot a{color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{font:500 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:6px 12px;cursor:pointer;border-radius:3px}
button:hover{border-color:var(--accent)}
button:focus-visible,label.item:focus-within,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.danger.armed{background:var(--accent);color:var(--bg);border-color:var(--accent)}
nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;border-bottom:3px solid transparent;background:none;border-radius:0;padding:8px 14px;font-family:var(--f-display);font-size:17px;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .tc{font-family:var(--f-mono);font-size:11px;margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
section.col{background:var(--panel);border:1px solid var(--line);min-width:0}
.colhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.colhead .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;letter-spacing:.03em}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.next{font-size:13px;color:var(--muted)}
.next b{color:var(--ink);font-weight:600}
ol{list-style:none;margin:0;padding:4px 0}
.phase{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);padding:14px 12px 4px;border-top:1px dashed var(--line)}
ol > .phase:first-child{border-top:0}
.phase a{color:var(--muted);text-decoration:none;letter-spacing:.04em;text-transform:none;white-space:nowrap}
.phase a:hover{color:var(--accent);text-decoration:underline}
label.item{display:grid;grid-template-columns:22px 34px 1fr;align-items:baseline;gap:6px;padding:5px 12px;cursor:pointer;border-left:3px solid transparent}
#planCol label.item{grid-template-columns:22px 1fr}
#planCol .num{display:none}
label.item:hover{background:var(--accent-soft)}
label.item input{margin:0;accent-color:var(--accent);width:16px;height:16px;transform:translateY(2px)}
.num{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.txt{min-width:0;max-width:80ch}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:0 5px;margin-left:6px;border:1px solid var(--line);color:var(--muted);border-radius:2px;vertical-align:1px}
.tag.sp{border-color:var(--accent);color:var(--accent)}
.note{display:block;font-size:12.5px;color:var(--muted);font-style:italic}
label.item.is-next{border-left-color:var(--accent);background:var(--accent-soft)}
label.item.done .txt{color:var(--done);text-decoration:line-through;text-decoration-color:var(--done)}
.hide-done label.item.done{display:none}
.hide-done .phase.empty{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);padding:12px 14px;min-width:0}
.card h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 8px;letter-spacing:.03em}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.card dt{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:1px}
.card dd{margin:0}
.card ul,.card ol.seq{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.card ol.seq{list-style:decimal}
.card ol.seq li::marker{font-family:var(--f-mono);color:var(--accent);font-size:12px}
.card p{margin:0 0 6px}
.card .small{font-size:13px;color:var(--muted)}
.card .ts{font-family:var(--f-mono);font-size:12px;color:var(--accent);text-decoration:none}
.prod{width:100%;border-collapse:collapse;font-size:13.5px}
.prod th{text-align:left;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);padding:8px 0 2px;font-weight:500}
.prod td{padding:2px 0;border-bottom:1px solid var(--line)}
.prod td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chapters{background:var(--panel);border:1px solid var(--line);padding:12px}
.chapters ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 16px}
.chapters a{color:var(--ink);text-decoration:none;display:flex;gap:10px;padding:3px 0}
.chapters a:hover span{color:var(--accent);text-decoration:underline}
.chapters time{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);min-width:42px;font-variant-numeric:tabular-nums}
.foot{font-size:12.5px;color:var(--muted);max-width:75ch;margin:0}
.sect{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.sh{border-bottom:1px solid var(--line);padding-bottom:4px}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
.figs.narrow{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.fig{margin:0;background:var(--panel);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.fig.wide{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(240px,1fr)}
.fig.wide .shot{border-bottom:0;border-right:1px solid var(--line)}
@media (max-width:760px){.fig.wide{grid-template-columns:1fr}.fig.wide .shot{border-right:0;border-bottom:1px solid var(--line)}}
.shot{display:block;position:relative;padding:0;margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--ink);cursor:zoom-in;width:100%;min-width:0}
.shot img{display:block;width:100%;height:auto}
.shot:hover img{filter:brightness(1.08)}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg);font:600 12.5px var(--f-mono);display:grid;place-items:center;box-shadow:0 0 0 2px rgba(0,0,0,.55);pointer-events:none}
figcaption{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
figcaption p{margin:0}
.caprow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.caprow .ts{margin-left:auto;white-space:nowrap}
.legend{margin:0;padding-left:22px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.legend li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.shotbtn{font:500 11.5px var(--f-mono);letter-spacing:.02em;padding:0 2px;margin-left:8px;vertical-align:1px;color:var(--accent);background:none;border:0;border-radius:2px;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.shotbtn:hover{text-decoration-style:solid;background:none}
label.item.done .shotbtn{opacity:.6}
.inshot{margin:2px 12px 12px 40px;width:fit-content;max-width:calc(100% - 52px);border:1px solid var(--line);background:var(--ink)}
.inshot img{display:block;max-width:100%;max-height:70vh;width:auto;height:auto;cursor:zoom-in}
.inshot-cap{font:500 11.5px var(--f-mono);color:var(--muted);background:var(--panel);padding:5px 8px;border-top:1px solid var(--line)}
.hide-done li:has(label.item.done) .inshot{display:none}
@media (max-width:480px){.inshot{margin-left:12px;max-width:calc(100% - 24px)}}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,11,9,.9);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-inner{max-width:min(1700px,100%);max-height:100%;display:flex;flex-direction:column;gap:8px;min-width:0}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#e4e1d4;font:500 13px var(--f-mono)}
.lb-bar button{background:#24271f;color:#e4e1d4;border-color:#3a3d33}
.lb img{display:block;max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;margin:0 auto;cursor:zoom-out}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.picker{display:flex;align-items:center;gap:6px;font:500 12px var(--f-mono);color:var(--muted)}
.picker select{font:500 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:5px 8px;border-radius:3px;max-width:100%}
.picker select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.loadmsg{background:var(--panel);border:1px solid var(--line);padding:14px;font-size:14px}
</style>
</head><body>

<div class="wrap">
  <header>
    <div>
      <h1 id="gTitle">HOI4 Tool</h1>
      <div class="sub" id="gSub"></div>
    </div>
    <div class="controls">
      <label class="picker">Guide <select id="guidePick"></select></label>
      <button id="hideDone" aria-pressed="false">Hide completed</button>
      <button id="resetBtn" class="danger">Reset all</button>
    </div>
  </header>

  <p class="loadmsg" id="loadMsg" hidden></p>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="plan" aria-selected="true">Game plan<span class="tc" data-tc="planCol"></span></button>
    <button role="tab" data-tab="trees" aria-selected="false">Focus &amp; research<span class="tc" data-tc="trees"></span></button>
    <button role="tab" data-tab="builds" aria-selected="false">Builds &amp; numbers</button>
  </nav>

  <div data-panel="plan">
    <section class="col" id="planCol">
      <div class="colhead">
        <div class="row"><h2>Step-by-step</h2><span class="count" data-count></span></div>
        <div class="bar"><i data-bar></i></div>
        <div class="next" data-next></div>
      </div>
      <ol data-list></ol>
    </section>
  </div>

  <div data-panel="trees" hidden>
    <div class="cols">
      <section class="col" id="focusCol">
        <div class="colhead">
          <div class="row"><h2>National Focus</h2><span class="count" data-count></span></div>
          <div class="bar"><i data-bar></i></div>
          <div class="next" data-next></div>
        </div>
        <ol data-list></ol>
      </section>
      <section class="col" id="researchCol">
        <div class="colhead">
          <div class="row"><h2>Research</h2><span class="count" data-count></span></div>
          <div class="bar"><i data-bar></i></div>
          <div class="next" data-next></div>
        </div>
        <ol data-list></ol>
      </section>
    </div>
  </div>

  <div data-panel="builds" id="builds" hidden></div>

  <div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="Screenshot">
    <div class="lb-inner">
      <div class="lb-bar"><span id="lbCap"></span><button id="lbClose" type="button">Close</button></div>
      <img id="lbImg" alt="">
    </div>
  </div>

  <div class="chapters">
    <h2>Video chapters</h2>
    <ul id="chapters"></ul>
  </div>

  <p class="foot"><span id="gSource"></span> <span class="tag">UP</span> means the next level of a tech you already have. <span class="tag sp">Special project</span> goes in the special-projects slot. Ticks are saved in this browser.</p>
</div>

<script src="guides/index.js"></script>
<script>
/* Guide files call registerGuide() when their <script> loads. Script tags (not fetch) keep file:// working. */
let G = null;
function registerGuide(g){ G = g; }

const TAGS = {up: "UP", sp: "Special project"};
const PREFS_KEY = "hoi4-tool-prefs";
const OLD_PREFIX = "hoi4-ger-checklist-v1";   // single-page version, before guides were split out
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch(e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

let prefs = load(PREFS_KEY, null);
if (!prefs){
  // first run of this version: carry over tab and hide-done from the old keys
  prefs = {};
  try { prefs.tab = localStorage.getItem(OLD_PREFIX+"-tab") || undefined; prefs.hide = localStorage.getItem(OLD_PREFIX+"-hide") === "1"; } catch(e){}
  put(PREFS_KEY, prefs);
}
const savePrefs = () => put(PREFS_KEY, prefs);

const secs = ts => ts.split(":").map(Number).reduce((a, b) => a*60 + b, 0);
const vlink = ts => { const u = new URL(G.meta.video); u.searchParams.set("t", secs(ts)+"s"); return u.href; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

/* per-guide progress: {ticks:{id:true}, open:{id:true}} */
let storeKey, store;
const save = () => put(storeKey, store);
function openStore(){
  storeKey = "hoi4-tool:" + G.meta.id;
  store = load(storeKey, null);
  if (store) return;
  store = {ticks: {}, open: {}};
  const L = G.legacy;
  if (L){
    // one-off migration from positional keys (g12, f3, r40) to stable step IDs. Old keys are left in place.
    const map = id => { const m = /^([a-z]+)(\d+)$/.exec(id); return m && L[m[1]] ? L[m[1]][m[2]-1] : null; };
    const copy = (from, to) => Object.keys(load(from, {})).forEach(k => { const id = map(k); if (id) to[id] = true; });
    copy(L.key, store.ticks);
    copy(L.key+"-open", store.open);
    if (Object.keys(store.ticks).length || Object.keys(store.open).length) store.migratedFrom = L.key;
  }
  save();
}

function build(colId, groups){
  const col = document.getElementById(colId), list = col.querySelector("[data-list]");
  let n = 0;
  groups.forEach(g => {
    let phaseEl = null;
    if (g.title){
      phaseEl = el("li", "phase");
      const s = el("span"); s.textContent = g.title; phaseEl.appendChild(s);
      if (g.ts && G.meta.video){ const a = el("a"); a.href = vlink(g.ts); a.target="_blank"; a.rel="noopener"; a.textContent = "▶ "+g.ts; phaseEl.appendChild(a); }
      list.appendChild(phaseEl);
    }
    g.steps.forEach(o => {
      n++;
      const id = o.id, tag = TAGS[o.tag];
      const li = el("li", null, `<label class="item"><input type="checkbox"><span class="num">${n}</span><span class="txt"></span></label>`);
      li.querySelector("input").id = id;
      const txt = li.querySelector(".txt");
      txt.appendChild(document.createTextNode(o.t));
      if (tag){ const s = el("span", "tag"+(o.tag==="sp"?" sp":"")); s.textContent = tag; txt.appendChild(s); }
      let pane = null;
      if (o.img && G.images[o.img]){
        const im = G.images[o.img], b = el("button", "shotbtn"); b.type = "button";
        pane = el("div", "inshot"); pane.hidden = true;
        const setOpen = open => {
          if (open && !pane.firstChild){
            const img = el("img"); img.src = im.file; img.alt = im.alt || im.caption || "";
            img.addEventListener("click", () => openLB(o.img, img));
            const cap = el("div", "inshot-cap"); cap.textContent = (im.caption||"")+" · click to enlarge";
            pane.append(img, cap);
          }
          pane.hidden = !open; b.setAttribute("aria-expanded", open); b.textContent = open ? "▾ Hide screen" : "▸ Show screen";
        };
        setOpen(!!store.open[id]);
        b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation();
          const open = pane.hidden; setOpen(open);
          if (open) store.open[id] = true; else delete store.open[id];
          save();
        });
        txt.appendChild(b);
      }
      if (o.n){ const s = el("span", "note"); s.textContent = o.n; txt.appendChild(s); }
      const label = li.querySelector("label"); label._phase = phaseEl; label._label = o.t + (tag ? " ("+tag+")" : "");
      const cb = li.querySelector("input");
      cb.checked = !!store.ticks[id];
      cb.addEventListener("change", () => { if (cb.checked) store.ticks[id] = true; else delete store.ticks[id]; save(); refresh(col); });
      if (pane) li.appendChild(pane);
      list.appendChild(li);
    });
  });
  refresh(col);
}

function refresh(col){
  const items = [...col.querySelectorAll("label.item")];
  let done = 0, next = null;
  items.forEach(l => {
    const c = l.querySelector("input").checked;
    l.classList.toggle("done", c); if (c) done++;
    l.classList.remove("is-next");
    if (!c && !next){ next = l; l.classList.add("is-next"); }
  });
  const nx = col.querySelector("[data-next]");
  if (next){ nx.innerHTML = "Next: <b></b>"; nx.querySelector("b").textContent = (col.id==="planCol" ? "" : next.querySelector(".num").textContent+". ") + next._label; }
  else nx.textContent = items.length ? "All done." : "";
  col.querySelector("[data-count]").textContent = done + " / " + items.length;
  col.querySelector("[data-bar]").style.width = (items.length ? done/items.length*100 : 0) + "%";
  col.querySelectorAll(".phase").forEach(p => {
    const mine = items.filter(l => l._phase === p);
    p.classList.toggle("empty", mine.length > 0 && mine.every(l => l.querySelector("input").checked));
  });
  updateTabCounts();
}

function updateTabCounts(){
  const pct = ids => { let d=0,t=0; ids.forEach(id=>{ const c=document.getElementById(id); if(!c) return; const it=c.querySelectorAll("label.item"); t+=it.length; it.forEach(l=>{ if(l.querySelector("input").checked) d++; }); }); return t ? Math.round(d/t*100)+"%" : ""; };
  const a = document.querySelector('[data-tc="planCol"]'), b = document.querySelector('[data-tc="trees"]');
  if (a) a.textContent = pct(["planCol"]);
  if (b) b.textContent = pct(["focusCol","researchCol"]);
}

/* Builds tab, rendered from guide.builds */
function tsLink(ts){ const a = el("a", "ts"); a.href = vlink(ts); a.target = "_blank"; a.rel = "noopener"; a.textContent = "▶ "+ts; return a; }
function buildFig(it){
  const im = G.images[it.img] || {}, fig = el("figure", "fig"+(it.wide ? " wide" : ""));
  const shot = el("button", "shot"); shot.dataset.img = it.img; shot.setAttribute("aria-label", "Enlarge "+(im.caption || it.title || "screenshot"));
  const img = el("img"); img.src = im.file; img.alt = im.alt || ""; img.loading = "lazy";
  if (im.w){ img.width = im.w; img.height = im.h; }
  shot.appendChild(img);
  (it.pins || []).forEach(([x, y], i) => { const p = el("span", "pin"); p.style.left = x+"%"; p.style.top = y+"%"; p.textContent = i+1; shot.appendChild(p); });
  shot.addEventListener("click", () => openLB(it.img, shot));
  const cap = el("figcaption"), row = el("div", "caprow");
  const b = el("b"); b.textContent = it.title || ""; row.appendChild(b);
  if (it.sub) row.appendChild(document.createTextNode(" · "+it.sub));
  if (it.ts && G.meta.video){ row.appendChild(document.createTextNode(" ")); row.appendChild(tsLink(it.ts)); }
  cap.appendChild(row);
  if (it.legend){ const ol = el("ol", "legend"); it.legend.forEach(s => ol.appendChild(el("li", null, rich(s)))); cap.appendChild(ol); }
  if (it.text) cap.appendChild(el("p", "small", rich(it.text)));
  fig.append(shot, cap);
  return fig;
}
function buildCard(it){
  const card = el("div", "card"), h = el("h3"); h.textContent = it.title || ""; card.appendChild(h);
  if (it.text) card.appendChild(el("p", "small", rich(it.text)));
  if (it.list){ const l = el(it.ordered ? "ol" : "ul", it.ordered ? "seq" : null); it.list.forEach(s => l.appendChild(el("li", null, rich(s)))); card.appendChild(l); }
  if (it.table){
    const t = el("table", "prod");
    it.table.forEach(sec => {
      const hr = el("tr"), th = el("th"); th.colSpan = 2; th.textContent = sec.head; hr.appendChild(th); t.appendChild(hr);
      sec.rows.forEach(([k, v]) => { const tr = el("tr"), a = el("td"), b = el("td"); a.textContent = k; b.textContent = v; tr.append(a, b); t.appendChild(tr); });
    });
    card.appendChild(t);
  }
  return card;
}
function buildBuilds(){
  const root = document.getElementById("builds");
  (G.builds || []).forEach(sec => {
    const s = el("div", "sect"), h = el("h2", "sh"); h.textContent = sec.title; s.appendChild(h);
    const grid = el("div", sec.layout === "cards" ? "cards" : "figs"+(sec.layout === "narrow" ? " narrow" : ""));
    sec.items.forEach(it => grid.appendChild(it.type === "fig" ? buildFig(it) : buildCard(it)));
    s.appendChild(grid); root.appendChild(s);
  });
}

/* lightbox */
const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbCap = document.getElementById("lbCap");
let lbReturn = null;
function openLB(key, from){
  const im = G.images[key] || {};
  lbImg.src = im.file; lbImg.alt = im.alt || im.caption || ""; lbCap.textContent = im.caption || "";
  lbReturn = from || null; lb.hidden = false; document.getElementById("lbClose").focus();
}
function closeLB(){ lb.hidden = true; lbImg.removeAttribute("src"); if (lbReturn) lbReturn.focus(); }
document.getElementById("lbClose").addEventListener("click", closeLB);
lb.addEventListener("click", e => { if (e.target === lb || e.target === lbImg) closeLB(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !lb.hidden) closeLB(); });

/* tabs */
const tabs = [...document.querySelectorAll("nav.tabs button")];
function showTab(name){
  if (!tabs.some(t => t.dataset.tab === name)) name = "plan";
  tabs.forEach(t => t.setAttribute("aria-selected", t.dataset.tab === name));
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== name);
  prefs.tab = name; savePrefs();
}
tabs.forEach(t => t.addEventListener("click", () => showTab(t.dataset.tab)));
showTab((location.hash || "").slice(1) || prefs.tab || "plan");

/* hide done */
const hideBtn = document.getElementById("hideDone");
const applyHide = () => { document.body.classList.toggle("hide-done", !!prefs.hide); hideBtn.setAttribute("aria-pressed", !!prefs.hide); };
applyHide();
hideBtn.addEventListener("click", () => { prefs.hide = !prefs.hide; savePrefs(); applyHide(); });

/* reset with in-page confirm (current guide only) */
const resetBtn = document.getElementById("resetBtn"); let armed = null;
resetBtn.addEventListener("click", () => {
  if (!G) return;
  if (!armed){ resetBtn.classList.add("armed"); resetBtn.textContent = "Click again to reset";
    armed = setTimeout(() => { armed=null; resetBtn.classList.remove("armed"); resetBtn.textContent="Reset all"; }, 3000); return; }
  clearTimeout(armed); armed = null; store.ticks = {}; save();
  document.querySelectorAll("label.item input").forEach(cb => cb.checked = false);
  ["planCol","focusCol","researchCol"].forEach(id => refresh(document.getElementById(id)));
  resetBtn.classList.remove("armed"); resetBtn.textContent = "Reset all";
});

/* guide picker + loading */
const pick = document.getElementById("guidePick");
const wanted = new URLSearchParams(location.search).get("guide") || prefs.guide;
const entry = GUIDES.find(g => g.id === wanted) || GUIDES[0];
GUIDES.forEach(g => { const o = el("option"); o.value = g.id; o.textContent = g.title; o.selected = g === entry; pick.appendChild(o); });
pick.addEventListener("change", () => {
  prefs.guide = pick.value; savePrefs();
  const u = new URL(location.href); u.searchParams.set("guide", pick.value); location.href = u.href;
});

function fail(msg){ const m = document.getElementById("loadMsg"); m.textContent = msg; m.hidden = false; }
function start(){
  if (!G || !G.meta){ fail("The guide file loaded but didn't register a guide: " + entry.file); return; }
  prefs.guide = G.meta.id; savePrefs();
  const M = G.meta;
  document.title = (M.short || M.title) + " Checklist";
  document.getElementById("gTitle").textContent = M.title;
  const sub = document.getElementById("gSub");
  sub.appendChild(document.createTextNode((M.author ? M.author + " — " : "")));
  if (M.video){ const a = el("a"); a.href = M.video; a.target = "_blank"; a.rel = "noopener"; a.textContent = M.guideTitle || "Video"; sub.appendChild(a); }
  else if (M.guideTitle) sub.appendChild(document.createTextNode(M.guideTitle));
  if (M.summary) sub.appendChild(document.createTextNode(" · " + M.summary));
  sub.appendChild(document.createTextNode(" · " + (M.patch ? "Patch " + M.patch : "Game patch not recorded, numbers may have drifted")));
  document.getElementById("gSource").textContent = M.source || "";

  openStore();
  build("planCol", G.plan || []);
  build("focusCol", G.focus || []);
  build("researchCol", G.research || []);
  buildBuilds();

  const ul = document.getElementById("chapters");
  (G.chapters || []).forEach(c => {
    const li = el("li", null, `<a target="_blank" rel="noopener"><time></time><span></span></a>`);
    li.querySelector("a").href = vlink(c.ts); li.querySelector("time").textContent = c.ts; li.querySelector("span").textContent = c.label;
    ul.appendChild(li);
  });
  ul.parentElement.hidden = !(G.chapters && G.chapters.length && M.video);
}

const s = document.createElement("script");
s.src = entry.file;
s.onload = start;
s.onerror = () => fail("Couldn't load the guide file " + entry.file + ".");
document.head.appendChild(s);
</script>

</body></html>
